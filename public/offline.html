<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <title>Hors connexion — CHEZMW</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #212529;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #0d6efd, #198754);
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 16px;
            padding: 32px 28px;
            text-align: center;
        }
        .mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, #0d6efd, #198754);
        }
        h1 { font-size: 1.5rem; margin: 0 0 8px; }
        p { margin: 0 0 20px; color: #495057; line-height: 1.5; }
        a {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            background: #0d6efd;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="mark" aria-hidden="true"></div>
        <h1>Vous êtes hors connexion</h1>
        <p>CHEZMW a besoin d’Internet pour afficher les logements. Vérifiez votre connexion, puis réessayez.</p>
        <a href="./">Réessayer</a>
    </main>
</body>
</html>
